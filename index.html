<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Digital Evidence Lab</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="src/styles/shell.css">
<link rel="stylesheet" href="src/styles/web.css">
<link rel="stylesheet" href="src/styles/apps.css">
<script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
</head>
<body>
<div id="root">
  <main id="opening" class="layer" hidden></main>
  <div id="stage3d" class="layer"></div>
  <main id="desktop" class="layer" hidden>
    <div id="lock" hidden></div>
    <div id="session">
      <div id="icons"></div>
      <div id="windows"></div>
      <div id="chat-dock" hidden></div>
      <div id="snap" hidden></div>
      <div id="nudge" hidden aria-hidden="true"></div>
      <div id="ctx-host"></div>
      <div id="start-host"></div>
      <div id="quick-host"></div>
      <div id="notif-host"></div>
      <div id="toasts" aria-live="polite"></div>
      <nav id="taskbar" aria-label="Taskbar"><div id="task-left"></div><div id="task-right"></div></nav>
    </div>
  </main>
  <main id="equipment" class="layer" hidden></main>
  <button id="eq-pointer" class="pointer" data-action="eq:pointer" hidden><i class="pt-ring"></i><i class="pt-ring two"></i><span class="pt-num"></span><span class="pt-text"></span></button>
  <div id="part-label" class="part-label" hidden aria-hidden="true"><i class="pl-dot"></i><svg class="pl-leader" width="64" height="30"><polyline points="0,0"/></svg><div class="pl-card"><b class="pl-name"></b><span class="pl-note"></span></div></div>
  <div id="thought" class="thought" hidden aria-live="polite"></div>
  <div id="dialogs"></div>
  <div id="fade"></div>
  <div id="dev-host"></div>
  <div id="paused" hidden><div><h1>Paused</h1><p>Calls, reviews and notifications are holding.</p><button class="btn primary big" data-action="pause:resume">Resume</button></div></div>
</div>
<script type="module" src="src/app.js"></script>
</body>
</html>
